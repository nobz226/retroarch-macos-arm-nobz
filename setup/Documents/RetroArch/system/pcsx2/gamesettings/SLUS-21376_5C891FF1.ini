;=============================================================================================
; Black
; Serial SLUS-21376, disc CRC 5C891FF1 (NTSC-U). PCSX2 settings for this game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies these fixes automatically:
; - CPU clamping: vuClampMode: 3 # Fixes SPS.
; - graphics fix: recommendedBlendingLevel: 4 # Improves lighting on buildings and objects.
; - graphics fix: autoFlush: 2 # Properly diffuses light instead of strips of light.
; - graphics fix: halfPixelOffset: 5 # Mostly aligns post-processing.
; - graphics fix: nativeScaling: 2 # Improves post-processing smoothness.
; - graphics fix: getSkipCount: "GSC_BlackAndBurnoutSky"
; - graphics fix: beforeDraw: "OI_BurnoutGames"
;
; AVAILABLE PATCHES FOR THIS DISC
; To use one, add a line "Enable = <name>" in the [Patches] section (or remove the ; in front
;   of an existing one). [ON] means it is enabled in this file.
; From the built-in patches.zip:
; - Widescreen 16:9: Widescreen hack
; - 60 FPS: Native 60 FPS. Might need EE Overclock (180%).
; - Video Mode: Always display standard-480p video selector.
; - No Blur While Reload: No blur while reloading weapons.
; From the custom file patches/SLUS-21376_5C891FF1.pnach:
; - 45 FPS: Paces frames 1, 1, 2 vblanks (45 fps on average) with a 1/45 s timestep, so the
;   game runs at normal speed. Uneven by design (every third frame lasts twice as long). Works
;   from savestates made at 30 or 60 fps. Use instead of 60 FPS, not with it.
;
;---------------------------------------------------------------------------------------------

; Patches for this game. One "Enable = <name>" line per patch. Put ; in front of a line to
;   turn that patch off; only one frame-rate patch at a time.
[Patches]
; Frame rate. Both are off, so the game runs at its original 30 fps (coolest). To use one,
; remove the ; in front of it. Use only one at a time; both keep the game speed correct.
; - 60 FPS (bundled, by Gabominated & PeterDelta): sets the game's own frame-rate constant
;   from 30 to 60 rather than just unlocking vsync. Smoothest, hottest.
; - 45 FPS (custom, patches/SLUS-21376_5C891FF1.pnach): frames paced 1, 1, 2 vblanks with a
;   1/45 s timestep. In between on heat; every third frame lasts twice as long, so panning
;   has a slight rhythm. It works from savestates made at any frame rate, but anything the
;   game worked out from its frame rate at a level load is only right after a fresh load.
;Enable = 60 FPS
;Enable = 45 FPS

; Optional EE overclock, mainly for the 60 FPS patch (its notes suggest 180%). Off: the game
; runs at stock clocks. To try it, remove the ; from BOTH lines below.
; 1 = 130%, 2 = 180%, 3 = 300%. It costs your Mac more CPU time.
;[EmuCore/Speedhacks]
;EECycleRate = 2

; Graphics (GS) settings for this game.
[EmuCore/GS]
; Black's GameDB forces autoflush on every primitive (needed for its lighting), and each flush
; can need a copy of the render target. On Metal this does those copies with a GPU blit
; instead of a render pass: the same pixels, much cheaper on Apple GPUs (from the Jak II work).
HWMetalHazardBlit = true
; Raster-order views: a GPU feature PCSX2 can use for accurate blending (true/false). On the
;   Metal renderer it only takes effect when framebuffer fetch is off, and Apple GPUs have
;   framebuffer fetch, so on your M2 it does nothing with Metal. With the Vulkan renderer it
;   is used if the GPU driver offers fragment shader interlock.
HWROV = true
; Debug blending mode (for testing only). Leave it off.
;UseDebugBlend = true


; Audio output.
[SPU2/Output]
; Audio sync. TimeStretch changes the audio speed without changing its pitch when the game
;   runs slower or faster than full speed, which avoids crackling and stutter. Other value:
;   Disabled (audio is played as it comes).
SyncMode = TimeStretch
