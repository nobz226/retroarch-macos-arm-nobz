;=============================================================================================
; Shin Onimusha - Dawn of Dreams [Disc 1 of 2]
; Serial SLPM-66275, disc CRC BD17248E (NTSC-J). PCSX2 settings for this game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies these fixes automatically:
; - graphics fix: recommendedBlendingLevel: 2 # Improves brightness.
; - graphics fix: halfPixelOffset: 5 # Mostly aligns post-processing.
; - graphics fix: nativeScaling: 2 # Fixes post-processing smoothness and position.
; - graphics fix: bilinearUpscale: 2 # Attempts to sharpen blurry text in menus.
;
; AVAILABLE PATCHES FOR THIS DISC
; To use one, add a line "Enable = <name>" in the [Patches] section (or remove the ; in front
;   of an existing one). [ON] means it is enabled in this file.
; From the built-in patches.zip:
; - Widescreen 16:9: no description
;
;---------------------------------------------------------------------------------------------

; Graphics (GS) settings for this game.
[EmuCore/GS]
; Raster-order views: a GPU feature PCSX2 can use for accurate blending (true/false). On the
;   Metal renderer it only takes effect when framebuffer fetch is off, and Apple GPUs have
;   framebuffer fetch, so on your M2 it does nothing with Metal. With the Vulkan renderer it
;   is used if the GPU driver offers fragment shader interlock.
HWROV = true


; Audio output.
[SPU2/Output]
; Audio sync. TimeStretch changes the audio speed without changing its pitch when the game
;   runs slower or faster than full speed, which avoids crackling and stutter. Other value:
;   Disabled (audio is played as it comes).
SyncMode = TimeStretch
