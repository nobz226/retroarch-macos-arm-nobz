;=============================================================================================
;=============================================================================================
; Shadow of the Colossus (Wanda to Kyozou)
; Serial SCPS-15097, disc CRC 877F3436 (NTSC-J, disc version 1.06). PCSX2 settings for this
;   game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies these fixes automatically:
; - CPU fix: eeRoundMode: 3 # Prevents Wander from moving when charging the floor.
;   (Wander still drifts slowly while charging at the ground: real PS2s do the same. The fix
;   keeps the drift at the right speed.)
; - graphics fix: halfPixelOffset: 5 # Fixes misalignments and borders on side.
; - graphics fix: nativeScaling: 3 # Fixes post effects shadows and DOF effects.
; - recommendation only: recommendedBlendingLevel: 4 # Fixes water color.
;   PCSX2 does not apply this one; it only shows an on-screen warning when blending accuracy
;   is lower. This file sets Basic for now (see [EmuCore/GS] below).
; This file does not set UserHacks, so the graphics fixes above stay on.
;
; AVAILABLE PATCHES FOR THIS DISC
; To use one, add a line "Enable = <name>" in the [Patches] section (or remove the ; in front
;   of an existing one). [ON] means it is enabled in this file.
; From the built-in patches.zip: none (no widescreen or frame-rate patches for any version).
; From the custom file patches/SCPS-15097_877F3436.pnach:
; - [ON] Perf - 30 FPS Cap: every frame lasts 2 vblanks (even 30 fps). Measured at the title
;   screen: GPU 51% -> 32%, CPU 125% -> 87% of a core. Game speed unchanged.
; - Perf - 45 FPS Cap: frames last 1, 1 and 2 vblanks in turn. Measured: GPU 51% -> 38%,
;   CPU 125% -> 107%. Game speed unchanged.
; Use one cap at a time; switching one off needs a reboot of the game.
;
; WHAT TO EXPECT (researched 2026-10-09)
; - Frame rate: the game is capped at 30 fps and drops below that when a scene is too much
;   work: on a real PS2 it runs between about 15 and 30 fps, lowest in big fights. That is
;   the game, not the emulator.
; - Distant textures can flicker on the horizon (3rd, 5th and 12th colossus arenas) with any
;   hardware renderer. Known PCSX2 issue; only the software renderer avoids it, and that is
;   far too slow for this game.
; - Very rarely the game can crash in the final cutscene (known PCSX2 issue, no fix). Save
;   before the last colossus.
; - Progressive scan (sharper picture): hold Triangle + Cross while the PS2 logo shows at boot
;   and accept the prompt. It has to be done at every boot.
; - Widescreen: the game has no 16:9 option and there is no patch, so it stays 4:3.
; Sources: PCSX2 wiki (Shadow of the Colossus), PCSX2 GitHub issues #4662, #11528, #13985.
;
;---------------------------------------------------------------------------------------------

; Graphics (GS) settings for this game.
[EmuCore/GS]
; Raster-order views: a GPU feature PCSX2 can use for accurate blending (true/false). On the
;   Metal renderer it only takes effect when framebuffer fetch is off, and Apple GPUs have
;   framebuffer fetch, so on your M2 it does nothing with Metal. With the Vulkan renderer it
;   is used if the GPU driver offers fragment shader interlock.
HWROV = true

; Blending accuracy: 0 = Minimum, 1 = Basic (the core option for all games), 2 = Medium,
;   3 = High, 4 = Full, 5 = Maximum. The game database recommends 4 to get the water colour
;   right (the lake, the shrine pool, the colossus arenas); at Basic the water may look
;   off-colour and PCSX2 shows a "Recommended Blending Accuracy" message at boot.
; Being tested 2026-10-09: Basic on its own (VU1 timing back to the core options), to see
;   whether it runs cooler than Full.
accurate_blending_unit = 1


; Audio output.
[SPU2/Output]
; Audio sync. TimeStretch changes the audio speed without changing its pitch when the game
;   runs slower or faster than full speed, which avoids crackling and stutter. Other value:
;   Disabled (audio is played as it comes).
SyncMode = TimeStretch


; CPU options. All left at the core options on purpose; the notes explain why.
[EmuCore/Speedhacks]
; EE cycle rate (emulated CPU speed, EECycleRate): keep the core option, 0. Raising it lets
;   the game reach its 30 fps cap more often, but the PCSX2 wiki advises against it
;   (untested, and an older report says it breaks the physics).
; EE cycle skipping (EECycleSkip): keep the core option, 0. Higher values crash a cutscene in
;   this game (PCSX2 issue #4662).
; VU1 timing. The core options run VU1 on its own thread (MTVU), which removes one of the
;   PS2's bottlenecks, so the game stays at its 30 fps cap more often than on a real PS2 (a
;   smoother game, but more work for the Mac). These two lines together make VU1 hold the
;   game back the way the PS2 did: closer to the original frame rate, less work. OFF for now; to try it, remove the // in front of both lines.
//vuThread = false
//vu1Instant = false

; Patches from patches/SCPS-15097_877F3436.pnach. Remove the ; to turn one on; one cap at a time.
[Patches]
; Turns on the named patch. The name must match the patch's [Name] exactly (see the list at
;   the top of this file).
Enable = Perf - 30 FPS Cap
;Enable = Perf - 45 FPS Cap
