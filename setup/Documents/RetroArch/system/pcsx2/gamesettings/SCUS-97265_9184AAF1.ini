;=============================================================================================
; Jak II
; Serial SCUS-97265, disc CRC 9184AAF1 (NTSC-U). PCSX2 settings for this game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies these fixes automatically:
; - graphics fix: halfPixelOffset: 4 # Aligns post-processing.
; - graphics fix: nativeScaling: 2 # Fixes post effects.
; - graphics fix: cpuSpriteRenderBW: 4 # Fixes character and water textures.
; - graphics fix: cpuSpriteRenderLevel: 2 # Needed for above.
; - graphics fix: autoFlush: 2 # Fixes lighting.
; NOTE: this file sets UserHacks = true, so the graphics fixes above are NOT applied; the
;   UserHacks_* values in this file are used instead. Game fixes and CPU clamping/rounding
;   still apply.
;
; AVAILABLE PATCHES FOR THIS DISC
; To use one, add a line "Enable = <name>" in the [Patches] section (or remove the ; in front
;   of an existing one). [ON] means it is enabled in this file.
; From the built-in patches.zip:
; - Widescreen 16:9: no description
; From the custom file patches/SCUS-97265_9184AAF1.pnach:
; - Perf - No Depth-Cue Blur: Skips the full-screen depth-cue (distance blur) pass. Clears bit
;   34 of *display* vu1-enable-user-menu (16-bit write of 0x0001 over the default 0x0005).
; - Perf - 30 FPS Lock: Turns on the engine's own half-speed mode: two vsyncs per frame with a
;   doubled timestep, so the game runs at normal speed at a steady 30 fps with about half the
;   GS/VU1 work.
; - [ON] Perf - 45 FPS Cap: Caps the game at ~45 fps through the engine's own frame pacer in
;   display-sync: every frame is held until 1.328 vsyncs have passed, and the game's clocks
;   advance by the measured time, so game speed stays correct. Use one cap at a time; the 30
;   FPS Lock overrides it. Takes effect live; switching it off needs a reboot (the code stays
;   patched).
; - Perf - 50 FPS Cap: Caps the game at ~50 fps through the engine's own frame pacer in
;   display-sync: every frame is held until 1.195 vsyncs have passed, and the game's clocks
;   advance by the measured time, so game speed stays correct. Use one cap at a time; the 30
;   FPS Lock overrides it. Takes effect live; switching it off needs a reboot (the code stays
;   patched).
;
;---------------------------------------------------------------------------------------------

; Jak II (NTSC-U, SCUS-97265) - per-game settings for the PCEE2 core.
; Copy to: <RetroArch System dir>/pcsx2/gamesettings/SCUS-97265_9184AAF1.ini
; Values here override the core options for this game only.
; Comments must stay on their own lines (the parser does not strip inline comments).

; Graphics (GS) settings for this game.
[EmuCore/GS]
; GPU->CPU readbacks stall Apple's tile-based GPUs. 3 = Unsynchronized (no stall).
; 0 = Accurate (core default), 4 = Disabled.
HWDownloadMode = 0

; Hazard copies by blit instead of a render pass (blit-fix core only; the stock core ignores this).
HWMetalHazardBlit = true



; Take manual control of the hardware fixes so the GameDB stops forcing them.
; The GameDB values for this game are noted above each line.
UserHacks = true

; GameDB 4: aligns the post-processing passes. Cheap, keep it.
UserHacks_HalfPixelOffset = 4

; GameDB 2: only does anything above 1x internal resolution.
UserHacks_native_scaling = 2

; GameDB 4 / 2: draws small texture-animation sprites (character and water
; textures) on the CPU instead of rendering and reading them back from the GPU.
; 0 / 0 turns it off. Faster only if it is your bottleneck. Expect wrong
; character and water textures.
UserHacks_CPUSpriteRenderBW = 4
; CPU sprite renderer level: 0 = sprites only, 1 = sprites and triangles (blended), 2 =
;   sprites and triangles. Works with UserHacks_CPUSpriteRenderBW. Only used when UserHacks =
;   true.
UserHacks_CPUSpriteRenderLevel = 2

; GameDB 2 (flush on every primitive): fixes lighting, very expensive.
; 0 = off. Profiled 2026-10-05: with 1 (sprites only), one small-texture effect in the
; opening scene (64-px-wide targets, ~360 self-sampling sprites per frame) became ~720
; serialized GPU steps per frame (~40 ms GPU) and ran at ~83% speed. With 0 it runs at a
; steady 100% (10-19 ms GPU) and looked the same. Set 1 if something renders wrong later.
UserHacks_AutoFlushLevel = 0

; Optional. The Jak engine scales its timestep to measured frame time, so an EE
; underclock lowers host CPU load while gameplay speed stays correct (the game
; drops frames instead of slowing down). -1 = 75%, -2 = 60%, -3 = 50%.
;[EmuCore/Speedhacks]
;EECycleRate = -1

; Patches from patches/SCUS-97265_9184AAF1.pnach (copy it to <System>/pcsx2/patches/).
; Put a ; in front of a line to turn that patch off.
[Patches]
; Turns on the named patch. The name must match the patch's [Name] exactly (see the list at
;   the top of this file).
;Enable = Perf - No Depth-Cue Blur
;Enable = Perf - 30 FPS Lock
; Frame-rate caps through the engine's own pacer (game speed stays correct). Use one at a time:
; the 30 FPS Lock above wins over both.
Enable = Perf - 45 FPS Cap
;Enable = Perf - 50 FPS Cap
