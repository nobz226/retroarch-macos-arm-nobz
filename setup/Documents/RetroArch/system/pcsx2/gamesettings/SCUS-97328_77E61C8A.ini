;=============================================================================================
; Gran Turismo 4
; Serial SCUS-97328, disc CRC 77E61C8A (NTSC-U). PCSX2 settings for this game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies no special fixes for this disc.
;
; AVAILABLE PATCHES FOR THIS DISC
; To use one, add a line "Enable = <name>" in the [Patches] section (or remove the ; in front
;   of an existing one). [ON] means it is enabled in this file.
; From the built-in patches.zip:
; - Widescreen 16:9: Corrects the text aspect ratio when 16:9 is selected.
; - Adjusted triggers sensitivity: Makes throttle/brake more precise when using triggers, like
;   on PS3
; - [ON] GT3 Chase Camera: GT3-like camera from GT4 First Preview
; - GT5 Camera Placement: Moves the exterior camera further from the ground like Gran Turismo
;   5.
; - Far chase camera: Added GT4 First Preview camera mode
; - Analog HUD For All Camera Views: The analog tachometer will be used for the chase camera.
; - Digital HUD For All Camera Views: The digital tachometer will be used for the bumper
;   camera and roof camera.
; - Reduce Vibration: Reduces the strength of the controller's vibration.
; - Disable Dynamic Race Text: Disables the text that appears at the bottom of the screen.
;   Example: "GET READY TO DRIVE"
; - Autoboot in 480p: The game will always start in 480p instead of 480i.
; - Photo Mode: Unlocks FPS in Photo Session.
