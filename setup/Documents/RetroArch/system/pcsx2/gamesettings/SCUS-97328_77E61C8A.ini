; Patches for this game. One "Enable = <name>" line per patch. Put ; in front of a line to
;   turn that patch off; only one frame-rate patch at a time.
[Patches]
// From patches/SCUS-97328_77E61C8A.pnach (all former cheats are in there now). One line per toggle; groups: see the top of that file.
// Distance cull: Light Distance Cull Track <T> Car <C>  |  caps: Track Light Cap <N>, Car Light Cap <N> (8/12/16/24/32)
; Turns on the named patch. The name must match the patch's [Name] exactly (see the list at
;   the top of this file).
Enable = Halo Off
Enable = Sun Flare Half Size
Enable = GT3 Chase Camera
Enable = Car Light Pair Thinning 50
Enable = Light Distance Cull Track 60 Car 40
Enable = Track Light Cap 12
Enable = Car Light Cap 12

; General emulator settings for this game.
[EmuCore]
; Turns on cheats from the cheats folder for this game. true/false.
EnableCheats = false
; Whether PCSX2's automatic game fixes from the database are applied. Keep this true.
//EnableGameFixes = true
//EnablePatches = true
; Whether PCSX2 warns at boot about settings that can cause problems. Only a notification.
WarnAboutUnsafeSettings = false


; Graphics (GS) settings for this game.
[EmuCore/GS]
; Raster-order views: a GPU feature PCSX2 can use for accurate blending (true/false). On the
;   Metal renderer it only takes effect when framebuffer fetch is off, and Apple GPUs have
;   framebuffer fetch, so on your M2 it does nothing with Metal. With the Vulkan renderer it
;   is used if the GPU driver offers fragment shader interlock.
HWROV = true
; Manual hardware fixes. true = the graphics fixes from PCSX2's game database (listed at the
;   top of this file) are NOT applied, and only the UserHacks_* values in this file are used.
;   false or missing = the database fixes apply automatically.
UserHacks = true
; Draw buffering: batches draws to reduce overhead. true/false. Only used when UserHacks =
;   true.
//UserHacks_DrawBuffering = true
//preload_frame_with_gs_data = true
//OsdShowSpeed = false
//OsdShowFPS = false
//OsdShowVPS = false
//OsdShowResolution = false
//OsdShowGSStats = false
//OsdShowCPU = false
//OsdShowGPU = false
//OsdShowGPUStats = false
//OsdShowFrameTimes = false
//OsdShowHardwareInfo = false
//OsdShowVersion = false
//OsdShowSettings = false
//OsdshowPatches = false
//OsdShowInputs = false
//OsdShowTextureReplacements = false
//OsdShowIndicators = false
//OsdShowInputRec = false
//HWDownloadMode = 2


; Audio output.
[SPU2/Output]
; Audio sync. TimeStretch changes the audio speed without changing its pitch when the game
;   runs slower or faster than full speed, which avoids crackling and stutter. Other value:
;   Disabled (audio is played as it comes).
SyncMode = TimeStretch


; CPU recompiler accuracy (clamping) settings for this game.
[EmuCore/CPU/Recompiler]
; FPU clamping (full): slowest and most accurate.
fpuFullMode = false
; FPU clamping (extra + preserve sign): part of the CPU accuracy settings.
fpuExtraOverflow = true
; FPU clamping (overflow): part of the CPU accuracy settings.
fpuOverflow = true
; FPU exact mode for the CPU recompiler.
fpuExactMode = false


; Speed hacks and CPU clocks for this game.
[EmuCore/Speedhacks]
; Wait loop detection: skips the emulated CPU's idle loops. Saves CPU time. true/false.
//WaitLoop = true
//IntcStat = true
//vuFlagHack = true
