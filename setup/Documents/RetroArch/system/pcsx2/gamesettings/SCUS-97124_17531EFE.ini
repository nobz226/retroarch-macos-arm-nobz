;=============================================================================================
; Jak and Daxter - The Precursor Legacy
; Serial SCUS-97124, disc CRC 17531EFE (NTSC-U). PCSX2 settings for this game only.
;=============================================================================================
; HOW THIS FILE WORKS
; PCSX2 (the PCEE2 core) loads this file when it boots the disc whose serial and CRC match the
;   file name. Anything set here overrides the PCEE2 core options in RetroArch, for this game
;   only. Settings that are not here come from the core options. Changes take effect the next
;   time the game is started.
;
; EDITING RULES
; - Lines starting with ; are comments and are ignored.
; - Comments must be on their own line: the parser does not strip comments after a value.
; - Lines starting with // are not real comments, but PCSX2 does not recognise them as
;   settings either, so they are effectively switched off. To turn one on, remove the //.
; - Each [Section] groups the settings below it; keep settings under their section.
; - Values are case-sensitive where they are names (patch names must match exactly).
;
; AUTOMATIC DATABASE FIXES
; PCSX2's game database rates this game: Perfect. It applies these fixes automatically:
; - graphics fix: recommendedBlendingLevel: 3 # Improves reflection quality.
; - graphics fix: cpuSpriteRenderBW: 4 # Fixes character and water textures.
; - graphics fix: cpuSpriteRenderLevel: 2 # Needed for above.
; - graphics fix: autoFlush: 2 # Fixes gate warp effect and emissive texture effects.
; NOTE: this file sets UserHacks = true, so the graphics fixes above are NOT applied; the
;   UserHacks_* values in this file are used instead. Game fixes and CPU clamping/rounding
;   still apply.
;
; AVAILABLE PATCHES FOR THIS DISC
; None: neither the built-in patches.zip nor the patches folder has a patch file for this
;   disc.
;
; WARNING: YOUR JAK 1 DISC HAS CRC 472E7699, NOT 17531EFE. This file is named for a different
;   version of the game, so PCSX2 never loads it and none of the settings below apply. To use
;   them, rename this file to SCUS-97124_472E7699.ini.
;
;---------------------------------------------------------------------------------------------

; Jak and Daxter: The Precursor Legacy (NTSC-U, SCUS-97124) - per-game settings for the PCEE2 core.
; Named for the Greatest Hits disc (ELF CRC 472E7699). For the original release use SCUS-97124_1B3976AB.ini.
; Values here override the core options for this game only.
; Comments must stay on their own lines (the parser does not strip inline comments).

; Graphics (GS) settings for this game.
[EmuCore/GS]
; GPU->CPU readbacks stall Apple's tile-based GPUs. 3 = Unsynchronized (no stall).
; 0 = Accurate (core default), 4 = Disabled.
HWDownloadMode = 0


; Hazard copies by blit instead of a render pass (blit-fix core only; the stock core ignores this).
;HWMetalHazardBlit = true



; Take manual control of the hardware fixes so the GameDB stops forcing them.
; The GameDB values for this game are noted above each line.
UserHacks = true

; GameDB 4 / 2: CPU sprite renderer for character and water textures.
; 0 / 0 turns it off. Expect wrong character and water textures.
UserHacks_CPUSpriteRenderBW = 4
; CPU sprite renderer level: 0 = sprites only, 1 = sprites and triangles (blended), 2 =
;   sprites and triangles. Works with UserHacks_CPUSpriteRenderBW. Only used when UserHacks =
;   true.
UserHacks_CPUSpriteRenderLevel = 2

; GameDB 2 (flush on every primitive): gate warp and glowing textures. Expensive.
; 1 = sprites only (this pack's default), 0 = off (fastest, those effects may break).
UserHacks_AutoFlushLevel = 1

; Renderer patches from patches/SCUS-97124_1B3976AB.pnach.
; Uncomment the ones you want once that file exists.
; (Jak 1 has no built-in half-speed mode, so there is no 30 FPS lock.)
[Patches]
; Turns on the named patch. The name must match the patch's [Name] exactly (see the list at
;   the top of this file).
;Enable = Perf - No Depth-Cue Blur
;Enable = Perf - No Shadows
