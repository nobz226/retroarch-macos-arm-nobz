# RBUJ08 - biohazard Umbrella Chronicles (Japan) [Wii]

[OnFrame]
# Add memory patches to be applied every frame here.
# 60 FPS: ported from the US code "04158204 60000000" (Nick Reynolds, Dolphin forums).
# The frame pacer at 0x8015841C waits for vblanks until at least 2 have passed
# (30 fps), then derives the game's time step from the vblanks that did pass.
# Removing that wait loop's branch lets a frame end after 1 vblank (60 fps); the
# time step halves with it, so game speed stays the same. Only applied if the
# original instruction (blt 0x80158430) is there.
$60 FPS
0x80158440:dword:0x60000000:0x4180FFF0

$Mash A instead of shake
# Scripted event QTEs (e.g. the co-op fire escape): table at 0x803F8190, 8 bytes per
# QTE code (input kind, button). Code 17 (shake Wii Remote) and code 20 (shake
# Nunchuk) become mash A (kind 0x10, button 0x0800), like code 18.
0x803F8218:dword:0x00000010:0x00000004
0x803F821C:dword:0x00000800:0x00000000
0x803F8230:dword:0x00000010:0x00000008
0x803F8234:dword:0x00000800:0x00000000
# The prompt switch at 0x8014B678 (jump table 0x803FAA00) shows codes 17 and 20 as
# the "mash A" prompt instead of the shake ones.
0x803FAA44:dword:0x8014B6AC:0x8014B6CC
0x803FAA50:dword:0x8014B6AC:0x8014B6D4
# Enemy grab struggle: the prompt becomes "mash A" and A (or Z) presses free you,
# instead of shaking the Wii Remote or Nunchuk.
# Stage 2 of a grab uses the game's own button path: the helper at 0x80068AE4 now
# returns the A-mash prompt (code 0x12) instead of shake (0x11 / 0x14).
0x80068B0C:dword:0x48000038:0x41820008
0x80068B44:dword:0x3BE00012:0x3BE00014
# Stage 1 shows the A-mash prompt too, and gets a button check (5 presses, the same
# count the game asks of shakes), placed in free low memory at 0x80001A00; the press
# counter lives at 0x80001AF0 (one word per player).
0x800678E8:dword:0x38C00012:0x38C00011
0x800673A0:dword:0x4BF9A660:0x480000A0
