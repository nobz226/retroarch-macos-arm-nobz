$Uncensored headshots
# The Japanese build turns off the zombie head pop. The zombie scripts pop the head on a
# critical headshot only when the script flag 'head_shot' is true; that flag reads the
# global at 0x806C2EA4. At level start (0x801169D8) the game compares its disc ID with
# "RBUJ" and "RBUX" and stores 0 there when either matches, 1 otherwise. This makes the
# matching case store 1 too, as the US version does.
0x80116A04:dword:0x38000001:0x38000000

