# SBDJ08 - BIOHAZARD THE DARKSIDE CHRONICLES (Japan) [Wii]

[OnFrame]
# Add memory patches to be applied every frame here.
# 60 FPS: ported from the US/EU code "04736D44 00000001" (solitarius, Dolphin wiki).
# The game's frame pacer (object at 0x80737290, wait loop at 0x802D8768) waits
# until the number of vblanks stored at +0x34 has passed (2 = 30 fps), then
# derives the game's time step from the vblanks that did pass. Holding that
# value at 1 gives 60 fps; the time step halves with it, so game speed stays the
# same. Dolphin wiki note: 60 fps is hard to hold in every location.
$60 FPS
0x807372C4:dword:0x00000001

$Mash A instead of shake
# QTE table at 0x806DA468 (16 bytes each: input check, button, prompt, help text).
# Entry 8 (shake Wii Remote) and entry 9 (shake Nunchuk) become copies of entry 5
# (mash A): the prompt and the input check both change.
0x806DA4E8:dword:0x00000002:0x00000004
0x806DA4EC:dword:0x00000800:0x00000000
0x806DA4F0:dword:0x00000005:0x00000008
0x806DA4F4:dword:0x00000036:0x0000003B
0x806DA4F8:dword:0x00000002:0x00000008
0x806DA4FC:dword:0x00000800:0x00000000
0x806DA500:dword:0x00000005:0x00000009
0x806DA504:dword:0x00000036:0x0000003C

$Uncensored headshots
# The Japanese build turns off the zombie head burst on a perfect headshot. The
# headshot routine at 0x80083D50 reads a flag (byte 0x14 of the settings object at
# 0x80747E78): on, it hides the head mesh ("head_on"), shows the stump ("head_off")
# and plays the head-burst effect, as in the US version; off, it plays the milder
# "Blood_headshotJP" effect instead. The constructor sets the flag on; the Japanese
# build then clears it at 0x8008C6BC (li r0, 0). This makes that store keep it on,
# and holds the flag itself on in case the store ran before the first patch frame.
0x8008C6BC:dword:0x38000001:0x38000000
0x80747E8C:byte:0x01

[OnFrame_Enabled]
$60 FPS
$Mash A instead of shake
$Uncensored headshots
